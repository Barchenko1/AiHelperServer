openai.api.url.completions=https://api.openai.com/v1/chat/completions
openai.api.url.transcriptions=https://api.openai.com/v1/audio/transcriptions
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.port=8080
#server.ssl.enabled=true
#server.ssl.key-store=classpath:keystore.p12
#server.ssl.key-store-password=changeit
#server.ssl.key-store-type=PKCS12

openAiModalVersion=gpt-4o
openAiTokensSize=1000
#APP_JWT_SECRET=change-this-long-random-secret-32+chars
#APP_NOOP_SECRET=1

# LLM provider: openai | claude (claude needs ANTHROPIC_API_KEY; voice transcription still uses OpenAI Whisper)
ai.provider=openai
claude.api.url.messages=https://api.anthropic.com/v1/messages
claude.api.version=2023-06-01
claudeModelVersion=claude-sonnet-5-5
