AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AiHelper on one EC2 instance. nginx routes https://DOMAIN/ to the React UI and
  https://DOMAIN/<BasePath>/ (REST + websocket) to the Spring Boot server on 127.0.0.1:8080.
  GitHub Actions in AiHelperServer / AiHelperUI deploy the app onto it over SSH.

Parameters:
  DomainName:
    Type: String
    Description: Site domain, e.g. screenintegration.com (bought/hosted in Route 53)
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone that owns DomainName
  CertificateEmail:
    Type: String
    Description: Email for Let's Encrypt expiry notices
  BasePath:
    Type: String
    Default: /aihelper
    AllowedPattern: '^/[A-Za-z0-9_-]+$'
    Description: Server routing prefix. Must equal the APP_BASE_PATH GitHub variable of AiHelperServer.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
  SshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Who may SSH in (key-only). GitHub Actions deploys over SSH from changing IPs, so keep it open unless you move deploys to SSM.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # ---------- Network ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: aihelper }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: aihelper-public }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Port 8080 is deliberately not opened: the server is only reachable through nginx.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AiHelper - HTTP/HTTPS public, SSH for deploys
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SshCidr }

  # ---------- Access ----------
  # The private key is stored by AWS in SSM Parameter Store at /ec2/keypair/<KeyPairId> (see outputs).
  DeployKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub '${AWS::StackName}-deploy'
      KeyType: ed25519

  # Lets you open a shell from the AWS console (Session Manager) without SSH.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------- Server ----------
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref DeployKeyPair
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 12, VolumeType: gp3, Encrypted: true }
      Tags: [{ Key: Name, Value: aihelper }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          # --- packages: Java 17 for the server, nginx for routing, certbot (in a venv) for HTTPS ---
          dnf install -y java-17-amazon-corretto-headless nginx python3 augeas-libs
          python3 -m venv /opt/certbot
          /opt/certbot/bin/pip install --upgrade pip
          /opt/certbot/bin/pip install certbot certbot-nginx
          ln -sf /opt/certbot/bin/certbot /usr/bin/certbot

          # --- folders the GitHub workflows deploy into ---
          mkdir -p /home/ec2-user/deployment/artifact /var/www/react-app/releases/initial /var/www/react-app/shared
          echo '<h1>AiHelper: waiting for the first UI deploy</h1>' > /var/www/react-app/releases/initial/index.html
          ln -sfn /var/www/react-app/releases/initial /var/www/react-app/current
          chown -R ec2-user:ec2-user /home/ec2-user/deployment /var/www/react-app

          # --- Spring Boot service (secrets + APP_BASE_PATH come from the server workflow's drop-in) ---
          cat > /etc/systemd/system/AiHelperServer.service <<'EOF'
          [Unit]
          Description=AiHelper Spring Boot server
          After=network.target
          ConditionPathExists=/home/ec2-user/deployment/artifact/app.jar

          [Service]
          User=ec2-user
          WorkingDirectory=/home/ec2-user/deployment/artifact
          ExecStart=/usr/bin/java -jar /home/ec2-user/deployment/artifact/app.jar
          Restart=always
          RestartSec=5
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable AiHelperServer

          # --- nginx routing: / -> UI, ${BasePath}/ -> server (prefix kept, websocket upgraded) ---
          cat > /etc/nginx/conf.d/aihelper.conf <<'EOF'
          map $http_upgrade $connection_upgrade { default upgrade; '' close; }

          server {
              listen 80;
              server_name ${DomainName};

              root  /var/www/react-app/current;
              index index.html;
              location / {
                  try_files $uri /index.html;
              }

              location ${BasePath}/ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade           $http_upgrade;
                  proxy_set_header Connection        $connection_upgrade;
                  proxy_set_header Host              $host;
                  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 3600s;
                  client_max_body_size 100m;
              }
          }
          EOF
          nginx -t
          systemctl enable --now nginx

          # --- HTTPS: wait until DNS points at this box, then get a Let's Encrypt cert and force https ---
          cat > /usr/local/bin/aihelper-https <<'EOF'
          #!/bin/bash
          for attempt in $(seq 1 120); do
            token=$(curl -s -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')
            my_ip=$(curl -s -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/public-ipv4)
            dns_ip=$(getent ahostsv4 ${DomainName} | awk 'NR==1 {print $1}')
            if [ -n "$my_ip" ] && [ "$my_ip" = "$dns_ip" ]; then
              certbot --nginx -n --agree-tos -m ${CertificateEmail} -d ${DomainName} --redirect && exit 0
            fi
            sleep 60
          done
          exit 1
          EOF
          chmod +x /usr/local/bin/aihelper-https

          cat > /etc/systemd/system/aihelper-https.service <<'EOF'
          [Unit]
          Description=Obtain the Let's Encrypt certificate once DNS is ready
          After=nginx.service network-online.target
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/aihelper-https
          EOF

          cat > /etc/systemd/system/certbot-renew.service <<'EOF'
          [Unit]
          Description=Renew Let's Encrypt certificates
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/certbot renew -q --deploy-hook "systemctl reload nginx"
          EOF

          cat > /etc/systemd/system/certbot-renew.timer <<'EOF'
          [Unit]
          Description=Twice-daily certificate renewal check
          [Timer]
          OnCalendar=*-*-* 00,12:00:00
          RandomizedDelaySec=1h
          Persistent=true
          [Install]
          WantedBy=timers.target
          EOF

          systemctl daemon-reload
          systemctl enable --now certbot-renew.timer
          systemctl start --no-block aihelper-https.service

  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: '60'
      ResourceRecords: [!Ref ElasticIp]

Outputs:
  SiteUrl:
    Description: The UI
    Value: !Sub 'https://${DomainName}/'
  ApiBaseUrl:
    Description: Server base URL - use as REACT_APP_AI_API (UI), aiHelperServerUrl (CLI) and the extension URL
    Value: !Sub 'https://${DomainName}${BasePath}'
  PublicIp:
    Value: !Ref ElasticIp
  DeployHost:
    Description: GitHub secret DEPLOY_HOST (both repos)
    Value: !Ref DomainName
  GetDeployKeyCommand:
    Description: Prints the private key for the GitHub secret DEPLOY_KEY (both repos)
    Value: !Sub 'aws ssm get-parameter --region ${AWS::Region} --name /ec2/keypair/${DeployKeyPair.KeyPairId} --with-decryption --query Parameter.Value --output text'
  ShellCommand:
    Description: Open a shell on the instance without SSH
    Value: !Sub 'aws ssm start-session --region ${AWS::Region} --target ${Instance}'
